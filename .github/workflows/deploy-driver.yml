name: Deploy Driver App to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/driver/**"
      - ".github/workflows/deploy-driver.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build Driver App
        run: pnpm --filter driver build
        env:
          VITE_API_URL: https://aunt-sallys-pos.onrender.com
          VITE_BASE_URL: /aunt-sallys-platform/driver/

      - name: Checkout gh-pages branch
        run: |
          git fetch origin gh-pages || true
          git worktree add gh-pages-out gh-pages 2>/dev/null || (git worktree add gh-pages-out --orphan gh-pages-new && git -C gh-pages-out checkout --orphan gh-pages-new)

      - name: Copy driver build into gh-pages
        run: |
          mkdir -p gh-pages-out/driver
          cp -r apps/driver/dist/. gh-pages-out/driver/
          cp apps/driver/dist/index.html gh-pages-out/driver/404.html

      - name: Commit and push
        run: |
          cd gh-pages-out
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add driver/
          git diff --staged --quiet || git commit -m "deploy: driver app"
          git push origin HEAD:gh-pages
